<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Handoff</title>
<meta name="theme-color" content="#101010">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Barlow+Condensed:wght@700;800&display=swap">
<style>
/* Dark + electric yellow. Yellow only on the main action and key highlights. */
:root{--bg:#101010;--card:#1B1B1B;--raise:#242424;--line:#343434;--fg:#F5F5F5;--muted:#A3A3A3;--y:#FFD400;--on-y:#101010;
  --urgent:#F04444;--normal:#F5A623;--ok:#38C779;--low:#A3A3A3;--r:12px;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;--f-body:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:default}
:focus-visible{outline:2px solid var(--y);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding:16px 16px 48px;display:flex;flex-direction:column;gap:14px}
/* Header */
.hdr{display:flex;align-items:center;gap:10px;padding:4px 0}
.mark{background:var(--y);color:var(--on-y);font-family:var(--f-display);font-weight:800;font-size:20px;width:34px;height:34px;border-radius:8px;display:grid;place-items:center}
.logo{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.06em}
.sp{flex:1}
.who{font-size:14px;color:var(--muted);max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Buttons */
.btn{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;border:1px solid var(--line);background:var(--raise);border-radius:10px;padding:10px 16px;font-weight:600;transition:transform .08s,background .15s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.y{background:var(--y);color:var(--on-y);border-color:var(--y)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.big{width:100%;min-height:52px;font-size:17px}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px}
.btn.danger{color:var(--urgent);background:transparent;border-color:color-mix(in srgb,var(--urgent) 50%,transparent)}
/* Summary + filters */
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;text-align:left;min-height:0}
.tile b{display:block;font-family:var(--f-display);font-size:26px;line-height:1.1}
.tile span{font-size:12.5px;color:var(--muted)}
.tile.on{border-color:var(--y)}
.tile.u b{color:var(--urgent)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--muted);font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip i{font-style:normal;opacity:.7;margin-left:4px}
/* Cards */
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;border-left:4px solid var(--line)}
.card.p-urgent{border-left-color:var(--urgent)}.card.p-normal{border-left-color:var(--normal)}.card.p-low{border-left-color:var(--line)}
.card.done{opacity:.72}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;border-radius:6px;padding:2px 8px;background:var(--raise);color:var(--muted);white-space:nowrap}
.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.tag.nodot::before{display:none}
.t-urgent{color:var(--urgent)}.t-normal{color:var(--normal)}.t-low{color:var(--low)}
.s-open{color:var(--y)}.s-claimed{color:#7DB7FF}.s-doing{color:var(--normal)}.s-done{color:var(--ok)}
.t-over{color:#fff;background:var(--urgent)}
.title{font-weight:600;font-size:16.5px;overflow-wrap:anywhere;line-height:1.35}
.meta{font-size:13.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 12px}
.meta b{color:var(--fg);font-weight:600}
.nobody{color:var(--y);font-weight:600}
.prog{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.bar{flex:1;height:5px;background:var(--raise);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.act{display:flex;gap:8px;flex-wrap:wrap}
.act .btn{flex:1}
.pics{display:flex;flex-wrap:wrap;gap:6px}
.pics .ph{position:relative;display:block}
.pics img{width:76px;height:76px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
.gal{display:grid;gap:3px;border-radius:10px;overflow:hidden;grid-template-columns:repeat(var(--c),1fr)}
.gal button{position:relative;padding:0;border:0;background:var(--raise);display:block;aspect-ratio:1;overflow:hidden}
.gal.n1 button{aspect-ratio:4/3;max-height:300px;width:100%}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gal .plus{position:absolute;inset:0;background:rgb(0 0 0 / .55);display:grid;place-items:center;font-size:22px;font-weight:700;color:#fff}
/* Full-screen photo viewer, LINE style: black stage, counter, swipe between photos. */
.lb{position:fixed;inset:0;background:#000;z-index:100;display:flex;flex-direction:column;animation:fade .15s ease-out}
@keyframes fade{from{opacity:0}}
.lbbar{display:flex;align-items:center;gap:8px;padding:max(10px,env(safe-area-inset-top)) 10px 10px;color:#fff}
.lbbar .btn{background:transparent;border-color:transparent;color:#fff;min-width:44px}
.lbbar .cnt{flex:1;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.lbstage{flex:1;position:relative;overflow:hidden;touch-action:pan-y pinch-zoom;display:flex;align-items:center;justify-content:center}
.lbstage img{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;transition:transform .2s ease-out}
.lbstage img.drag{transition:none}
.lbnav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:64px;border:0;border-radius:10px;background:rgb(255 255 255 / .12);color:#fff;font-size:26px}
.lbnav.prev{left:8px}.lbnav.next{right:8px}
.lbdots{display:flex;justify-content:center;gap:6px;padding:12px 0 max(16px,env(safe-area-inset-bottom))}
.lbdots i{width:7px;height:7px;border-radius:50%;background:rgb(255 255 255 / .35)}.lbdots i.on{background:#fff}
@media (hover:none){.lbnav{display:none}}
.ph .x{position:absolute;top:-8px;right:-8px;background:var(--raise);border:1px solid var(--line);border-radius:50%;width:26px;height:26px;padding:0;line-height:1}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:36px 16px;text-align:center;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted)}
/* Forms */
input,textarea,select{background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:12px 14px;width:100%;font-size:16px}
input::placeholder,textarea::placeholder{color:#7a7a7a}
textarea{min-height:76px;resize:vertical}
input[type=date]{min-height:48px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:600;color:var(--muted)}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
.sheet h2{margin:0;font-size:18px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--raise);font-weight:600;font-size:14px}
.seg button[aria-pressed="true"].urgent{background:var(--urgent);border-color:var(--urgent);color:#fff}
.seg button[aria-pressed="true"].normal{background:var(--normal);border-color:var(--normal);color:#101010}
.seg button[aria-pressed="true"].low{background:var(--fg);border-color:var(--fg);color:#101010}
details.more-f{border-top:1px solid var(--line);padding-top:12px}
details.more-f summary{cursor:pointer;font-weight:600;color:var(--fg);min-height:32px;list-style:none;display:flex;align-items:center;gap:8px}
details.more-f summary::before{content:"+";display:grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--raise)}
details.more-f[open] summary::before{content:"−"}
details.more-f .in{display:flex;flex-direction:column;gap:14px;margin-top:12px}
.row{display:flex;gap:8px;align-items:center}
.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--raise);cursor:pointer}
.chk input{width:22px;height:22px;margin-top:1px;accent-color:var(--ok);flex:none;padding:0}
.chk span{flex:1;min-width:0;overflow-wrap:anywhere}
.chk.done span{text-decoration:line-through;color:var(--muted)}
.chk .x{border:none;background:none;color:var(--muted);font-size:20px;line-height:1;padding:0 6px;min-height:28px}
.err{background:color-mix(in srgb,var(--urgent) 15%,transparent);border:1px solid var(--urgent);color:#ffb4b4;border-radius:10px;padding:10px 12px;font-size:14px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--raise);border:1px solid var(--line);color:var(--fg);padding:10px 16px;border-radius:10px;z-index:80;max-width:calc(100% - 32px);font-size:14px;animation:up .2s ease-out}
.toast.bad{border-color:var(--urgent)}
@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}
/* Detail */
.modal-bg{position:fixed;inset:0;background:rgb(0 0 0 / .65);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--card);border:1px solid var(--line);border-radius:16px;width:100%;max-width:600px;max-height:90dvh;overflow:auto;display:flex;flex-direction:column}
.mhead{position:sticky;top:0;background:var(--card);padding:16px 16px 10px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:flex-start;z-index:1}
.mbody{padding:14px 16px 20px;display:flex;flex-direction:column;gap:18px}
.sec h3{margin:0 0 8px;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
.txt{white-space:pre-wrap;overflow-wrap:anywhere}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.steps button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--raise);font-weight:600;font-size:14px}
.steps button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14px}
.hist li{display:flex;gap:10px}
.hist li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--line);margin-top:7px}
.hist small{color:var(--muted)}
.center{min-height:80dvh;display:flex;flex-direction:column;justify-content:center;gap:14px}
h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1;letter-spacing:.02em}
@media (max-width:520px){.modal-bg{align-items:flex-end;padding:0}.modal{border-radius:16px 16px 0 0;max-height:92dvh}}
@media (min-width:700px){.wrap{padding-top:28px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head><body>
<div class="wrap" id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ago(ts){const d=Date.now()-ts,M=6e4,H=36e5;if(d<M)return'เมื่อสักครู่';if(d<H)return Math.floor(d/M)+' นาทีที่แล้ว';if(d<24*H)return Math.floor(d/H)+' ชม.ที่แล้ว';return new Date(ts).toLocaleDateString('th-TH',{day:'numeric',month:'short',timeZone:'Asia/Bangkok'})}
const when=ts=>new Date(ts).toLocaleString('th-TH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'Asia/Bangkok'});

/* Dates are compared as calendar days in Thailand time. */
const ymdBKK=d=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok'}).format(d);
const dayN=s=>Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10))/864e5;
function dueInfo(t){if(!t.due)return null;const diff=dayN(t.due)-dayN(ymdBKK(new Date()));
  const nice=new Date(t.due+'T00:00:00+07:00').toLocaleDateString('th-TH',{day:'numeric',month:'short',timeZone:'Asia/Bangkok'});
  if(diff<0&&status(t)!=='done')return{cls:'t-over',txt:'เกินกำหนด · '+nice,over:true};
  return{cls:'nodot',txt:'กำหนดส่ง '+(diff===0?'วันนี้':diff===1?'พรุ่งนี้':nice),over:false}}

const PRI={urgent:'เร่งด่วน',normal:'ปกติ',low:'ไม่เร่งด่วน'};
const ST={open:'ยังไม่มีคนรับ',claimed:'รับงานแล้ว',doing:'กำลังทำ',done:'เสร็จแล้ว'};
/* Status: rows from before statuses existed have none, so derive it from the assignee. */
const status=t=>!t.claimedBy?'open':(t.status||'claimed');

let me=null,tasks=[],events={},adding=false,col=null,conn='connecting',draft=[],openId=null,delId=null,filter='all',fp='normal',saving=false,formErr='';
let draftPics={t:[],n:[]};
try{me=localStorage.getItem('jd-name')}catch(e){}

/* All tasks live in the shared Supabase database; nothing is kept only in one browser. */
const SUPABASE_URL='https://vtuyyzrftuqmbaycbqat.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ0dXl5enJmdHVxbWJheWNicWF0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1MTE0MzgsImV4cCI6MjEwNzA4NzQzOH0.eiC9E0NnMEl5b24xaS9-PeTxGY3naUOR3AXWa93xHk0';
const PHOTO_PRE=SUPABASE_URL+'/storage/v1/object/public/photos/';
function arr(v){return Array.isArray(v)?v:[]}
function pics(v){return arr(v).filter(u=>typeof u==='string'&&u.startsWith(PHOTO_PRE))}
const fromRow=r=>({id:r.id,title:r.title,desc:r.desc||'',items:arr(r.items).filter(x=>x&&typeof x==='object'),createdBy:r.created_by,createdAt:Date.parse(r.created_at),
  claimedBy:r.claimed_by,claimedAt:r.claimed_at&&Date.parse(r.claimed_at),photos:pics(r.photos),notePhotos:pics(r.note_photos),
  priority:PRI[r.priority]?r.priority:'normal',due:typeof r.due_date==='string'?r.due_date:null,status:ST[r.status]?r.status:null,handoff:r.handoff_note||''});
const COLS={createdBy:'created_by',createdAt:'created_at',claimedBy:'claimed_by',claimedAt:'claimed_at',notePhotos:'note_photos',due:'due_date',handoff:'handoff_note'};
const toRow=p=>{const o={};for(const[k,v]of Object.entries(p)){o[COLS[k]||k]=/At$/.test(k)&&v?new Date(v).toISOString():v}return o};
const ok=({error})=>{if(error)throw error};
const items=t=>t.items;
const doneN=t=>items(t).filter(i=>i.done).length;

function shrink(f){return new Promise((res,rej)=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('อ่านรูปไม่ได้')),'image/jpeg',.8)};im.onerror=()=>rej(new Error('อ่านรูปไม่ได้'));im.src=u})}
async function upload(files){const out=[];for(const f of files){const b=await shrink(f),path=Date.now()+'-'+Math.random().toString(36).slice(2)+'.jpg';ok(await col.storage.from('photos').upload(path,b,{contentType:'image/jpeg'}));out.push(col.storage.from('photos').getPublicUrl(path).data.publicUrl)}return out}

/* History rows are written right after the change they describe succeeds. */
async function logEv(id,action,detail=''){try{await col.from('task_events').insert({task_id:id,actor:me,action,detail})}catch(e){}}
async function addTask(t){const{data,error}=await col.from('tasks').insert(toRow(t)).select('id').single();if(error)throw error;
  await logEv(data.id,'สร้างงาน');if(t.claimedBy)await logEv(data.id,'มอบหมายงาน','ให้ '+t.claimedBy);await load()}
async function patch(id,p,ev){ok(await col.from('tasks').update(toRow(p)).eq('id',id));if(ev)await logEv(id,...ev);await load()}
/* Claim only if nobody holds the task yet, so two people tapping at once cannot both get it. */
async function claim(id){const{data,error}=await col.from('tasks').update(toRow({claimedBy:me,claimedAt:Date.now(),status:'claimed'})).eq('id',id).is('claimed_by',null).select('id');
  if(error)throw error;if(!data.length){await load();throw new Error('มีคนรับงานนี้ไปก่อนแล้ว')}
  await logEv(id,'รับงาน');await load()}
async function remove(id){const t=tasks.find(x=>x.id===id);ok(await col.from('tasks').delete().eq('id',id));
  const files=t?[...t.photos,...t.notePhotos].map(u=>u.slice(PHOTO_PRE.length)):[];
  if(files.length)await col.storage.from('photos').remove(files).catch(()=>{});await load()}
async function loadEvents(id){const{data,error}=await col.from('task_events').select('*').eq('task_id',id).order('created_at',{ascending:true});
  if(!error){events[id]=data;if(openId===id)refreshDetail()}}

function toast(m,bad){$$('.toast').forEach(n=>n.remove());const n=document.createElement('div');n.className='toast'+(bad?' bad':'');n.setAttribute('role','status');n.textContent=m;document.body.append(n);setTimeout(()=>n.remove(),3500)}
const run=async(f,msg,okMsg)=>{if(!col){toast('ยังเชื่อมต่อฐานข้อมูลไม่ได้ ข้อมูลยังไม่ถูกบันทึก',true);return false}
  try{await f();if(okMsg)toast(okMsg);return true}catch(err){toast(msg+': '+(err.message||err.code||err),true);render();return false}};

/* Ordering: unfinished first, then urgent, overdue/soonest due, newest. */
const PR={urgent:0,normal:1,low:2};
function sorted(list){return[...list].sort((a,b)=>(status(a)==='done')-(status(b)==='done')||PR[a.priority]-PR[b.priority]||(a.due||'9999').localeCompare(b.due||'9999')||b.createdAt-a.createdAt)}
const FILTERS={all:['ทั้งหมด',()=>true],open:['ยังไม่มีคนรับ',t=>status(t)==='open'],mine:['งานของฉัน',t=>t.claimedBy===me&&status(t)!=='done'],done:['เสร็จแล้ว',t=>status(t)==='done'],urgent:['เร่งด่วน',t=>t.priority==='urgent'&&status(t)!=='done']};

function tagsHTML(t){const s=status(t),d=dueInfo(t);
  return `<div class="tags"><span class="tag t-${t.priority}">${PRI[t.priority]}</span><span class="tag s-${s}">${ST[s]}</span>${d?`<span class="tag ${d.cls}">${esc(d.txt)}</span>`:''}</div>`}
function progHTML(t){const n=items(t).length;if(!n)return'';return `<div class="prog"><div class="bar"><i style="width:${doneN(t)/n*100}%"></i></div><span>${doneN(t)}/${n} ข้อ</span></div>`}
/* Photo grid: one photo shows wide, two side by side, more in a 3-up grid with a +N tile. */
const allPics=t=>[...t.photos,...t.notePhotos];
function galHTML(t,urls,offset,max){if(!urls.length)return'';const show=urls.slice(0,max),extra=urls.length-show.length,c=show.length===1?1:show.length===2?2:3;
  return `<div class="gal n${show.length}" style="--c:${c}">${show.map((u,i)=>`<button type="button" data-lb="${esc(t.id)}:${offset+i}" aria-label="ดูรูปที่ ${offset+i+1} แบบเต็มจอ"><img src="${esc(u)}" alt="" loading="lazy">${extra&&i===show.length-1?`<span class="plus">+${extra}</span>`:''}</button>`).join('')}</div>`}
const thumbs=t=>galHTML(t,allPics(t),0,3);
function draftPicsHTML(k){return draftPics[k].map((f,i)=>`<span class="ph"><img src="${f.url}" alt="รูปที่เลือก"><button type="button" class="x" data-rp="${k}:${i}" aria-label="ลบรูปนี้">×</button></span>`).join('')}
function checklistHTML(list,editable){return list.map((it,i)=>`<label class="chk ${it.done?'done':''}"><input type="checkbox" data-i="${i}" ${it.done?'checked':''}><span>${esc(it.text)}</span>${editable?`<button type="button" class="x" data-rm="${i}" aria-label="ลบหัวข้อนี้">×</button>`:''}</label>`).join('')}

function cardHTML(t){const s=status(t);
  return `<article class="card p-${t.priority} ${s==='done'?'done':''}">${tagsHTML(t)}
   <div class="title">${esc(t.title)}</div>
   <div class="meta"><span>โดย <b>${esc(t.createdBy)}</b> · ${ago(t.createdAt)}</span><span>${t.claimedBy?`ผู้รับ <b>${esc(t.claimedBy)}</b>`:'<span class="nobody">ยังไม่มีคนรับ</span>'}</span></div>
   ${progHTML(t)}${thumbs(t)}
   <div class="act"><button class="btn sm" data-open="${esc(t.id)}">ดูรายละเอียด</button>${s==='open'?`<button class="btn sm y" data-claim="${esc(t.id)}">รับงาน</button>`:''}</div></article>`}

function headerHTML(){return `<header class="hdr"><span class="mark" aria-hidden="true">H</span><span class="logo">HANDOFF</span><span class="sp"></span>${me?`<span class="who">${esc(me)}</span><button class="btn ghost sm" id="out">ออกจากระบบ</button>`:''}</header>`}

function formHTML(){return `<form class="sheet" id="af" novalidate><h2>เพิ่มงาน</h2>
  <label class="f">ชื่องาน *<input id="tt" placeholder="เช่น ต่องาน Stock / Order SFS" required autocomplete="off"></label>
  <div class="f" style="display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:600;color:var(--muted)">ความสำคัญ
   <div class="seg" role="group" aria-label="ความสำคัญ">${['urgent','normal','low'].map(p=>`<button type="button" class="${p}" data-pri="${p}" aria-pressed="${fp===p}">${PRI[p]}</button>`).join('')}</div></div>
  <label class="f">กำหนดส่ง (ไม่บังคับ)<input type="date" id="tdue"></label>
  <details class="more-f"><summary>รายละเอียดเพิ่มเติม (ไม่บังคับ)</summary><div class="in">

    <div class="row" style="margin-top:8px"><input id="ni" placeholder="เพิ่มข้อ เช่น เช็ค RTV ครบ 100"><button type="button" class="btn" id="nadd">เพิ่ม</button></div></div>
   <div><label class="btn sm" style="width:max-content">📷 แนบรูปงาน<input type="file" accept="image/*" multiple hidden data-pick="t"></label><div class="pics" id="pt" style="margin-top:8px">${draftPicsHTML('t')}</div></div>

   <div><label class="btn sm" style="width:max-content">📷 แนบรูปรายละเอียด<input type="file" accept="image/*" multiple hidden data-pick="n"></label><div class="pics" id="pn" style="margin-top:8px">${draftPicsHTML('n')}</div></div>
   <label class="f">หมายเหตุส่งต่องาน<textarea id="th" placeholder="บริบท ทำอะไรไปแล้ว ต้องทำอะไรต่อ ของอยู่ตรงไหน"></textarea></label>
   <label class="f">มอบหมายให้ (ถ้าต้องการ)<input id="tas" placeholder="ชื่อผู้รับงาน" autocomplete="off"></label>

function render(){const app=$('#app');
  if(!me){app.innerHTML=`${headerHTML()}<div class="center"><h1>เข้าสู่ระบบ</h1><div class="muted" style="color:var(--muted)">ใส่ชื่อของคุณเพื่อเริ่มใช้งาน</div>
    <form id="lf" style="display:flex;flex-direction:column;gap:10px"><label class="f">ชื่อ<input id="name" placeholder="ชื่อของคุณ" autocomplete="name" required></label><button class="btn y big">เข้าสู่ระบบ</button></form></div>`;
    $('#lf').onsubmit=e=>{e.preventDefault();const v=$('#name').value.trim();if(!v)return;me=v;try{localStorage.setItem('jd-name',v)}catch(e){}render()};$('#name').focus();return}
  if(conn!=='ok'){app.innerHTML=headerHTML()+(conn==='connecting'?`<div class="empty">กำลังโหลดงาน…</div>`:`<div class="sheet" style="border-color:var(--urgent)"><b>เชื่อมต่อฐานข้อมูลงานไม่ได้</b>
    <div style="font-size:14px;color:var(--muted)">ตรวจสอบสัญญาณอินเทอร์เน็ต แล้วกดลองใหม่</div><div><button class="btn" id="retry">ลองใหม่</button></div></div>`);
    bindOut();if($('#retry'))$('#retry').onclick=()=>location.reload();return}
  const live=tasks.filter(t=>status(t)!=='done');
  const cnt=k=>tasks.filter(FILTERS[k][1]).length;
  const shown=sorted(tasks.filter(FILTERS[filter][1]));
  app.innerHTML=`${headerHTML()}
  ${adding?formHTML():`<button class="btn y big" id="add">+ เพิ่มงาน</button>`}
  <div class="sum">
   <button class="tile ${filter==='all'?'on':''}" data-f="all"><b>${live.length}</b><span>งานที่เปิดอยู่</span></button>
   <button class="tile ${filter==='open'?'on':''}" data-f="open"><b>${cnt('open')}</b><span>ยังไม่มีคนรับ</span></button>
   <button class="tile u ${filter==='urgent'?'on':''}" data-f="urgent"><b>${cnt('urgent')}</b><span>เร่งด่วน</span></button></div>
  <div class="chips" role="group" aria-label="กรองงาน">${['all','open','mine','done','urgent'].map(k=>`<button class="chip" data-f="${k}" aria-pressed="${filter===k}">${FILTERS[k][0]}<i>${k==='all'?tasks.length:cnt(k)}</i></button>`).join('')}</div>
  ${shown.length?`<div class="list">${shown.map(cardHTML).join('')}</div>`:`<div class="empty">${tasks.length?'ไม่มีงานในหมวดนี้':'ยังไม่มีงาน<br>กด “+ เพิ่มงาน” เพื่อเริ่ม'}</div>`}
  <div class="note">● บันทึกในฐานข้อมูลกลาง ทุกคนที่มีลิงก์เห็นงานชุดเดียวกัน</div>
  <div id="detail">${detailHTML()}</div>`;
  bind()}

function detailHTML(){const t=tasks.find(x=>x.id===openId);if(!t)return'';const s=status(t),list=items(t),n=list.length,d=dueInfo(t);
  const mine=t.claimedBy===me,canEdit=mine||t.createdBy===me,ev=events[t.id];
  const todo=list.map((x,i)=>[x,i]).filter(([x])=>!x.done),did=list.map((x,i)=>[x,i]).filter(([x])=>x.done);
  const ck=arr=>arr.map(([it,i])=>`<label class="chk ${it.done?'done':''}"><input type="checkbox" data-i="${i}" ${it.done?'checked':''}><span>${esc(it.text)}</span></label>`).join('');
  return `<div class="modal-bg" id="mbg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
   <div class="mhead"><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px">${tagsHTML(t)}<b id="mt" style="font-size:18px;overflow-wrap:anywhere">${esc(t.title)}</b></div><button class="btn ghost sm" id="close">ปิด</button></div>
   <div class="mbody">
    <dl class="kv"><dt>ผู้สร้าง</dt><dd>${esc(t.createdBy)} · ${when(t.createdAt)}</dd>
     <dt>ผู้รับ</dt><dd>${t.claimedBy?esc(t.claimedBy):'<span class="nobody">ยังไม่มีคนรับ</span>'}</dd>
     <dt>ความสำคัญ</dt><dd>${PRI[t.priority]}</dd><dt>กำหนดส่ง</dt><dd>${d?esc(d.txt.replace('กำหนดส่ง ','')):'ไม่ได้กำหนด'}</dd></dl>
    ${s==='open'?`<button class="btn y big" data-claim="${esc(t.id)}">รับงานนี้</button>`:''}
    ${s!=='open'?`<div class="sec"><h3>สถานะ</h3>${mine?`<div class="steps" role="group" aria-label="เปลี่ยนสถานะ">${['claimed','doing','done'].map(k=>`<button data-st="${k}" aria-pressed="${s===k}">${ST[k]}</button>`).join('')}</div>`
      :`<div>${ST[s]}</div><div class="note">เฉพาะผู้รับงาน (${esc(t.claimedBy)}) เปลี่ยนสถานะได้</div>`}</div>`:''}
    ${t.handoff||canEdit?`<div class="sec"><h3>หมายเหตุส่งต่องาน</h3>${t.handoff?`<div class="txt">${esc(t.handoff)}</div>`:'<div class="note">ยังไม่มีหมายเหตุ</div>'}
      ${canEdit?`<details class="more-f" style="margin-top:8px"><summary>แก้ไขหมายเหตุ</summary><div class="in"><textarea id="eh">${esc(t.handoff)}</textarea><button class="btn" id="saveh">บันทึกหมายเหตุ</button></div></details>`:''}</div>`:''}
    <div class="sec"><h3>สิ่งที่ยังต้องทำ${n?` · ทำแล้ว ${doneN(t)}/${n}`:''}</h3>${n?progHTML(t):''}<div class="cl">${todo.length?ck(todo):`<div class="note">${n?'ครบทุกข้อแล้ว':'ยังไม่มีรายการ'}</div>`}</div>
     <div class="row" style="margin-top:8px"><input id="mi" placeholder="เพิ่มสิ่งที่ต้องทำ"><button class="btn" id="madd">เพิ่ม</button></div></div>
    ${did.length?`<div class="sec"><h3>สิ่งที่ทำไปแล้ว</h3><div class="cl">${ck(did)}</div></div>`:''}
    ${t.desc||t.notePhotos.length||t.photos.length?`<div class="sec"><h3>รายละเอียดและรูปแนบ</h3>${galHTML(t,t.photos,0,99)}${t.desc?`<div class="txt" style="margin-top:8px">${esc(t.desc)}</div>`:''}${t.notePhotos.length?`<div style="margin-top:8px">${galHTML(t,t.notePhotos,t.photos.length,99)}</div>`:''}</div>`:''}
    ${canEdit?`<div class="sec"><h3>จัดการงาน</h3><div style="display:flex;flex-direction:column;gap:10px">
      <label class="f">เปลี่ยนกำหนดส่ง<div class="row"><input type="date" id="edue" value="${esc(t.due||'')}"><button class="btn" id="savedue">บันทึก</button></div></label>
      <label class="f">ส่งต่อให้คนอื่น<div class="row"><input id="eas" placeholder="ชื่อผู้รับคนใหม่" autocomplete="off"><button class="btn" id="saveas">ส่งต่อ</button></div></label></div></div>`:''}
    <div class="sec"><h3>ประวัติการอัปเดต</h3>${ev?(ev.length?`<ul class="hist">${ev.map(e=>`<li><div><b>${esc(e.actor)}</b> ${esc(e.action)}${e.detail?` <span style="color:var(--muted)">${esc(e.detail)}</span>`:''}<br><small>${when(Date.parse(e.created_at))}</small></div></li>`).join('')}</ul>`:'<div class="note">ยังไม่มีประวัติ (งานที่สร้างก่อนเริ่มบันทึกประวัติจะไม่มีรายการย้อนหลัง)</div>'):'<div class="note">กำลังโหลด…</div>'}</div>
    ${delId===t.id?`<div class="sheet" style="border-color:var(--urgent)"><b>ลบงาน “${esc(t.title)}”?</b><div class="note">ลบแล้วกู้คืนไม่ได้ รูปแนบจะถูกลบด้วย</div><div class="act"><button class="btn" id="dno">ไม่ลบ</button><button class="btn danger" id="dyes">ลบงาน</button></div></div>`
     :`<button class="btn danger" id="del">ลบงาน</button>`}
   </div></div></div>`}
function refreshDetail(){const box=$('#detail');if(!box)return;const sc=$('.modal')?.scrollTop||0;box.innerHTML=detailHTML();if($('.modal'))$('.modal').scrollTop=sc;bindDetail()}

function bindOut(){if($('#out'))$('#out').onclick=()=>{me=null;try{localStorage.removeItem('jd-name')}catch(e){}render()}}
function formDirty(){return adding&&!!($('#tt')?.value.trim()||$('#td')?.value.trim()||$('#th')?.value.trim()||$('#tas')?.value.trim()||$('#tdue')?.value||draft.length||draftPics.t.length||draftPics.n.length)}
function closeForm(){adding=false;draft=[];fp='normal';formErr='';clearPics();render()}
function bind(){bindOut();
  $$('[data-f]').forEach(b=>b.onclick=()=>{filter=b.dataset.f;render()});
  if(adding){const ni=$('#ni');
    const push=()=>{const v=ni.value.trim();if(!v)return;draft.push({text:v,done:false});$('#dl').innerHTML=checklistHTML(draft,true);ni.value='';ni.focus()};
    $('#nadd').onclick=push;ni.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();push()}};
    $('#dl').onclick=e=>{const rm=e.target.closest('[data-rm]');if(rm){e.preventDefault();draft.splice(+rm.dataset.rm,1);$('#dl').innerHTML=checklistHTML(draft,true)}};
    $('#dl').onchange=e=>{const i=e.target.dataset.i;if(i==null)return;draft[i].done=e.target.checked;$('#dl').innerHTML=checklistHTML(draft,true)};
    $$('[data-pri]').forEach(b=>b.onclick=()=>{fp=b.dataset.pri;$$('[data-pri]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.pri===fp))});
    const showPics=k=>{$('#p'+k).innerHTML=draftPicsHTML(k)};
    $$('[data-pick]').forEach(inp=>inp.onchange=()=>{const k=inp.dataset.pick;for(const f of inp.files)draftPics[k].push({file:f,url:URL.createObjectURL(f)});inp.value='';showPics(k)});
    $('#af').addEventListener('click',e=>{const b=e.target.closest('[data-rp]');if(!b)return;const[k,i]=b.dataset.rp.split(':');URL.revokeObjectURL(draftPics[k][i].url);draftPics[k].splice(+i,1);showPics(k)});
    $('#cancel').onclick=()=>{if(formDirty()&&!confirm('ทิ้งข้อมูลที่กรอกไว้?'))return;closeForm()};
    $('#af').onsubmit=async e=>{e.preventDefault();if(saving)return;const title=$('#tt').value.trim(),ferr=$('#ferr');
      if(!title){ferr.hidden=false;ferr.textContent='กรุณาใส่ชื่องาน';$('#tt').focus();return}
      const pending=ni.value.trim();if(pending){draft.push({text:pending,done:false});ni.value=''}
      const as=$('#tas').value.trim();
      const t={title,items:draft,desc:$('#td').value.trim(),handoff:$('#th').value.trim(),priority:fp,due:$('#tdue').value||null,createdBy:me,createdAt:Date.now(),
        claimedBy:as||null,claimedAt:as?Date.now():null,status:as?'claimed':null};
      const save=$('#save');saving=true;save.disabled=true;ferr.hidden=true;
      try{if(draftPics.t.length||draftPics.n.length){save.textContent='กำลังอัปโหลดรูป…';
          const a=await upload(draftPics.t.map(x=>x.file)),b=await upload(draftPics.n.map(x=>x.file));if(a.length)t.photos=a;if(b.length)t.notePhotos=b}
        save.textContent='กำลังบันทึก…';
        if(!col)throw new Error('ยังเชื่อมต่อฐานข้อมูลไม่ได้');
        await addTask(t);saving=false;closeForm();toast('บันทึกงานแล้ว')}
      catch(err){saving=false;save.disabled=false;save.textContent='บันทึกงาน';ferr.hidden=false;ferr.textContent='บันทึกไม่สำเร็จ: '+(err.message||err)+' ลองกดบันทึกอีกครั้ง'}};
    if(!$('#tt').value)$('#tt').focus()}
  else $('#add').onclick=()=>{adding=true;draft=[];fp='normal';formErr='';clearPics();render()};
  $$('.list [data-claim]').forEach(b=>b.onclick=()=>{b.disabled=true;b.textContent='กำลังรับงาน…';run(()=>claim(b.dataset.claim),'รับงานไม่สำเร็จ','รับงานแล้ว')});
  $$('[data-open]').forEach(b=>b.onclick=()=>{openId=b.dataset.open;delId=null;refreshDetail();loadEvents(openId);$('#close')?.focus()});
  bindDetail()}
function bindDetail(){const t=tasks.find(x=>x.id===openId);if(!t)return;
  const close=()=>{openId=null;delId=null;refreshDetail()};
  $('#close').onclick=close;$('#mbg').onclick=e=>{if(e.target.id==='mbg')close()};
  $$('#mbg [data-claim]').forEach(b=>b.onclick=()=>{b.disabled=true;b.textContent='กำลังรับงาน…';run(()=>claim(t.id),'รับงานไม่สำเร็จ','รับงานแล้ว')});
  $$('[data-st]').forEach(b=>b.onclick=()=>{const k=b.dataset.st;if(k===status(t))return;$$('[data-st]').forEach(x=>x.disabled=true);
    run(()=>patch(t.id,{status:k},['เปลี่ยนสถานะ',ST[status(t)]+' → '+ST[k]]),'เปลี่ยนสถานะไม่สำเร็จ','บันทึกสถานะแล้ว')});
  $$('#mbg .cl').forEach(cl=>cl.onchange=e=>{const i=+e.target.dataset.i;const list=items(t).map((x,j)=>j===i?{...x,done:e.target.checked}:x);run(()=>patch(t.id,{items:list}),'บันทึกไม่สำเร็จ')});
  const mi=$('#mi');const madd=()=>{const v=mi.value.trim();if(!v)return;$('#madd').disabled=true;run(()=>patch(t.id,{items:[...items(t),{text:v,done:false}]}),'เพิ่มรายการไม่สำเร็จ')};
  $('#madd').onclick=madd;mi.onkeydown=e=>{if(e.key==='Enter')madd()};
  if($('#saveh'))$('#saveh').onclick=()=>{const v=$('#eh').value.trim();if(v===t.handoff)return;$('#saveh').disabled=true;run(()=>patch(t.id,{handoff:v},['แก้ไขหมายเหตุส่งต่องาน']),'บันทึกหมายเหตุไม่สำเร็จ','บันทึกหมายเหตุแล้ว')};
  if($('#savedue'))$('#savedue').onclick=()=>{const v=$('#edue').value||null;if(v===t.due)return;$('#savedue').disabled=true;
    run(()=>patch(t.id,{due:v},['แก้ไขกำหนดส่ง',(t.due||'ไม่มี')+' → '+(v||'ไม่มี')]),'บันทึกกำหนดส่งไม่สำเร็จ','บันทึกกำหนดส่งแล้ว')};
  if($('#saveas'))$('#saveas').onclick=()=>{const v=$('#eas').value.trim();if(!v||v===t.claimedBy)return;$('#saveas').disabled=true;
    run(()=>patch(t.id,{claimedBy:v,claimedAt:Date.now(),status:'claimed'},['เปลี่ยนผู้รับ',(t.claimedBy||'ไม่มี')+' → '+v]),'ส่งต่องานไม่สำเร็จ','ส่งต่องานแล้ว')};
  if($('#del'))$('#del').onclick=()=>{delId=t.id;refreshDetail()};
  if($('#dno'))$('#dno').onclick=()=>{delId=null;refreshDetail()};
  if($('#dyes'))$('#dyes').onclick=()=>{const id=t.id;openId=null;delId=null;refreshDetail();run(()=>remove(id),'ลบไม่สำเร็จ','ลบงานแล้ว')};
}
function clearPics(){for(const k in draftPics)draftPics[k].forEach(x=>URL.revokeObjectURL(x.url));draftPics={t:[],n:[]}}
/* Viewer lives outside #app so syncs and re-renders never close it. */
let lb=null;
function openLB(urls,i){lb={urls,i};const el=document.createElement('div');el.className='lb';el.id='lb';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-label','ดูรูป');
  el.innerHTML=`<div class="lbbar"><button class="btn" id="lbx" aria-label="ปิด">✕</button><span class="cnt" id="lbc"></span><a class="btn" id="lbo" target="_blank" rel="noopener" aria-label="เปิดรูปขนาดจริง">เปิดรูปจริง</a></div>
   <div class="lbstage" id="lbs"><img id="lbi" alt=""><button class="lbnav prev" id="lbp" aria-label="รูปก่อนหน้า">‹</button><button class="lbnav next" id="lbn" aria-label="รูปถัดไป">›</button></div><div class="lbdots" id="lbd"></div>`;
  document.body.append(el);document.body.style.overflow='hidden';
  $('#lbx').onclick=closeLB;$('#lbp').onclick=()=>stepLB(-1);$('#lbn').onclick=()=>stepLB(1);
  const st=$('#lbs'),img=$('#lbi');let x0=null,y0=0,dx=0;
  st.addEventListener('touchstart',e=>{if(e.touches.length!==1){x0=null;return}x0=e.touches[0].clientX;y0=e.touches[0].clientY;dx=0;img.classList.add('drag')},{passive:true});
  st.addEventListener('touchmove',e=>{if(x0==null||e.touches.length!==1)return;dx=e.touches[0].clientX-x0;if(Math.abs(dx)>Math.abs(e.touches[0].clientY-y0))img.style.transform=`translateX(${dx}px)`},{passive:true});
  st.addEventListener('touchend',()=>{if(x0==null)return;img.classList.remove('drag');img.style.transform='';x0=null;
    if(dx<-50)stepLB(1);else if(dx>50)stepLB(-1)});
  showLB();$('#lbx').focus()}
function showLB(){const{urls,i}=lb,n=urls.length;$('#lbi').src=urls[i];$('#lbo').href=urls[i];$('#lbc').textContent=n>1?`${i+1} / ${n}`:'';
  $('#lbp').hidden=i===0;$('#lbn').hidden=i===n-1;$('#lbd').innerHTML=n>1?urls.map((_,j)=>`<i class="${j===i?'on':''}"></i>`).join(''):''}
function stepLB(d){const j=lb.i+d;if(j<0||j>=lb.urls.length)return;lb.i=j;showLB()}
function closeLB(){lb=null;$('#lb')?.remove();document.body.style.overflow=''}
document.addEventListener('click',e=>{const b=e.target.closest('[data-lb]');if(!b)return;const[id,i]=b.dataset.lb.split(':');const t=tasks.find(x=>x.id===id);if(t)openLB(allPics(t),+i)});
document.addEventListener('keydown',e=>{if(!lb)return;if(e.key==='Escape'){e.stopImmediatePropagation();closeLB()}else if(e.key==='ArrowLeft')stepLB(-1);else if(e.key==='ArrowRight')stepLB(1)},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&openId){openId=null;delId=null;refreshDetail()}});
window.addEventListener('beforeunload',e=>{if(formDirty()){e.preventDefault();e.returnValue=''}});
render();

/* Don't redraw while someone is typing, so their input is never wiped by a sync. */
function typing(){const a=document.activeElement;return a&&/^(INPUT|TEXTAREA)$/.test(a.tagName)&&a.value&&a.closest('#mbg')}
async function load(){const{data,error}=await col.from('tasks').select('*').order('created_at',{ascending:false});
  if(error){if(conn!=='ok'){conn='off';render()}return}
  tasks=data.map(fromRow);if(openId&&!tasks.some(x=>x.id===openId))openId=null;
  const first=conn!=='ok';conn='ok';
  if(first||!adding&&!typing())render();
  if(openId)loadEvents(openId)}
(()=>{if(!window.supabase){conn='off';render();return}
  col=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  load();
  col.channel('tasks').on('postgres_changes',{event:'*',schema:'public',table:'tasks'},()=>load())
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'task_events'},p=>{if(p.new&&p.new.task_id===openId)loadEvents(openId)}).subscribe();
  setInterval(()=>{if(!document.hidden)load()},15000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
})();
</script>
</body></html>
