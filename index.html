<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JD Work Handoff</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Barlow+Condensed:wght@700;800&display=swap">
<style>
body{margin:0}
/* Layout: one calm centered column. Login, then a task list with a single add button. */
:root{--bg:#f4f4f2;--surface:#fff;--line:#dcdcd8;--fg:#111;--muted:#6b6b66;--ink:#111;--on-ink:#fff;--accent:#f2c200;--on-accent:#111;--ok:#1b7f3b;--wait:#b26a00;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;--f-body:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e0e;--surface:#181818;--line:#2e2e2e;--fg:#f2f2f0;--muted:#9a9a94;--ink:#f2f2f0;--on-ink:#111;--ok:#4cc576;--wait:#f0a53a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0e0e;--surface:#181818;--line:#2e2e2e;--fg:#f2f2f0;--muted:#9a9a94;--ink:#f2f2f0;--on-ink:#111;--ok:#4cc576;--wait:#f0a53a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;min-height:100%;display:flex;flex-direction:column;gap:20px}
.brand{display:flex;align-items:center;gap:10px}
.mark{background:var(--ink);color:var(--on-ink);font-family:var(--f-display);font-weight:800;font-size:18px;width:34px;height:34px;border-radius:8px;display:grid;place-items:center}
.brand b{font-family:var(--f-display);font-size:20px;text-transform:uppercase;letter-spacing:.03em}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:600}
.btn.pri{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.btn.acc{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:6px 10px}
.btn.big{padding:14px 20px;font-size:16px;width:100%}
.center{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px}
h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:36px;line-height:1.05;text-transform:uppercase;text-wrap:balance}
.muted{color:var(--muted)}
input,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;width:100%;font-size:16px}
textarea{min-height:80px;resize:vertical}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:center}
.card .body{flex:1;min-width:0}
.card .t{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.card .d{font-size:13.5px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere;white-space:pre-wrap}
.meta{font-size:13px;color:var(--muted);margin-top:6px;display:flex;gap:4px 12px;flex-wrap:wrap}
.meta b{color:var(--fg);font-weight:600}
.pill{font-size:12px;font-weight:700;border:1px solid currentColor;border-radius:99px;padding:2px 10px;white-space:nowrap}
.empty{border:1px dashed var(--line);border-radius:12px;padding:40px 16px;text-align:center;color:var(--muted)}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.note{font-size:12.5px;color:var(--muted)}
@media (max-width:480px){.card{flex-direction:column;align-items:stretch}.card .act{justify-content:stretch}.card .act .btn{flex:1}}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.chk input{width:20px;height:20px;margin-top:2px;accent-color:var(--ok);flex:none;padding:0}
.chk span{flex:1;min-width:0;overflow-wrap:anywhere}
.chk.done span{text-decoration:line-through;color:var(--muted)}
.chk .x{border:none;background:none;color:var(--muted);font-size:18px;line-height:1;padding:0 4px}
.row{display:flex;gap:8px;align-items:center}
.prog{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--ok)}
.act{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn.sm{padding:6px 12px;font-size:13.5px}
.pics{display:flex;flex-wrap:wrap;gap:6px}.pics img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}.pics .ph{position:relative}.pics .ph .x{position:absolute;top:-6px;right:-6px;background:var(--surface);border:1px solid var(--line);border-radius:50%;width:22px;height:22px;line-height:18px;padding:0}.card .pics img{width:48px;height:48px}
.btn.danger{color:#c62828;border-color:currentColor;background:transparent}
.modal-bg{position:fixed;inset:0;background:rgb(0 0 0 / .5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:560px;max-height:90vh;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
@media (max-width:480px){.modal-bg{align-items:flex-end;padding:0}.modal{border-radius:16px 16px 0 0}}
</style>

</head><body>
<div class="wrap" id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ago(ts){const d=Date.now()-ts,M=6e4,H=36e5;if(d<M)return'เมื่อสักครู่';if(d<H)return Math.floor(d/M)+' นาทีที่แล้ว';if(d<24*H)return Math.floor(d/H)+' ชม.ที่แล้ว';return new Date(ts).toLocaleDateString('th-TH',{day:'numeric',month:'short'})}

let me=null,tasks=[],adding=false,col=null,conn='connecting',draft=[],openId=null,delId=null;
try{me=localStorage.getItem('jd-name')}catch(e){}

/* Storage: shared database when the viewer supports it, otherwise this browser only. */
/* All tasks live in the artifact's shared database; nothing is kept only in one browser. */
const SUPABASE_URL='https://vtuyyzrftuqmbaycbqat.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ0dXl5enJmdHVxbWJheWNicWF0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1MTE0MzgsImV4cCI6MjEwNzA4NzQzOH0.eiC9E0NnMEl5b24xaS9-PeTxGY3naUOR3AXWa93xHk0';
// Row <-> app field names
const fromRow=r=>({id:r.id,title:r.title,desc:r.desc||'',items:arr(r.items).filter(x=>x&&typeof x==='object'),createdBy:r.created_by,createdAt:Date.parse(r.created_at),claimedBy:r.claimed_by,claimedAt:r.claimed_at&&Date.parse(r.claimed_at),photos:pics(r.photos),notePhotos:pics(r.note_photos)});
function arr(v){return Array.isArray(v)?v:[]}
function pics(v){return arr(v).filter(u=>typeof u==='string'&&u.startsWith(SUPABASE_URL+'/storage/v1/object/public/photos/'))}
const toRow=p=>{const o={};for(const[k,v]of Object.entries(p)){const c={createdBy:'created_by',createdAt:'created_at',claimedBy:'claimed_by',claimedAt:'claimed_at',notePhotos:'note_photos'}[k]||k;o[c]=/At$/.test(k)&&v?new Date(v).toISOString():v}return o};
const ok=({error})=>{if(error)throw error};
function shrink(f){return new Promise((res,rej)=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('อ่านรูปไม่ได้')),'image/jpeg',.8)};im.onerror=()=>rej(new Error('อ่านรูปไม่ได้'));im.src=u})}
async function upload(files){const out=[];for(const f of files){const b=await shrink(f),path=Date.now()+'-'+Math.random().toString(36).slice(2)+'.jpg';ok(await col.storage.from('photos').upload(path,b,{contentType:'image/jpeg'}));out.push(col.storage.from('photos').getPublicUrl(path).data.publicUrl)}return out}
function picsHTML(urls){return urls.length?`<div class="pics">${urls.map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="รูปแนบ" loading="lazy"></a>`).join('')}</div>`:''}
function draftPicsHTML(key){return draftPics[key].map((f,i)=>`<span class="ph"><img src="${f.url}" alt="รูปที่เลือก"><button type="button" class="x" data-rp="${key}:${i}" aria-label="ลบรูป">×</button></span>`).join('')}
async function addTask(t){ok(await col.from('tasks').insert(toRow(t)));await load()}
async function patch(id,p){ok(await col.from('tasks').update(toRow(p)).eq('id',id));await load()}
async function remove(id){const t=tasks.find(x=>x.id===id);ok(await col.from('tasks').delete().eq('id',id));
  const pre=SUPABASE_URL+'/storage/v1/object/public/photos/',files=t?[...t.photos,...t.notePhotos].map(u=>u.slice(pre.length)):[];
  if(files.length)await col.storage.from('photos').remove(files).catch(()=>{});await load()}
const items=t=>Array.isArray(t.items)?t.items:[];
const doneN=t=>items(t).filter(i=>i.done).length;
const ERR={};
const run=async(f,msg)=>{if(!col){alertMsg('ยังเชื่อมต่อฐานข้อมูลไม่ได้ ข้อมูลยังไม่ถูกบันทึก');return}try{await f()}catch(err){alertMsg(msg+': '+(ERR[err.code]||err.message||err.code||err))}};

function checklistHTML(list,editable){return list.map((it,i)=>`<label class="chk ${it.done?'done':''}"><input type="checkbox" data-i="${i}" ${it.done?'checked':''}><span>${esc(it.text)}</span>${editable?`<button type="button" class="x" data-rm="${i}" aria-label="ลบหัวข้อ">×</button>`:''}</label>`).join('')}

function render(){const app=$('#app');
  if(!me){app.innerHTML=`<div class="center">
    <div class="brand"><span class="mark">JD</span><b>Work Handoff</b></div>
    <h1>เข้าสู่ระบบ</h1><div class="muted">ใส่ชื่อของคุณเพื่อเริ่มใช้งาน</div>
    <form id="lf" style="display:flex;flex-direction:column;gap:10px"><input id="name" placeholder="ชื่อของคุณ" autocomplete="name" required><button class="btn pri big">เข้าสู่ระบบ</button></form></div>`;
    $('#lf').onsubmit=e=>{e.preventDefault();const v=$('#name').value.trim();if(!v)return;me=v;try{localStorage.setItem('jd-name',v)}catch(e){}render()};$('#name').focus();return}
  const open=tasks.filter(t=>!t.claimedBy).length;
  if(conn!=='ok'){app.innerHTML=`<div class="brand"><span class="mark">JD</span><b>Work Handoff</b><span class="sp"></span><span class="muted" style="font-size:14px">${esc(me)}</span><button class="btn ghost" id="out">ออก</button></div>
    ${conn==='connecting'?`<div class="empty">กำลังโหลดงาน…</div>`:`<div class="sheet" style="border-color:var(--wait)"><b>เชื่อมต่อฐานข้อมูลงานไม่ได้</b>
    <div style="font-size:14px">ตรวจสอบสัญญาณอินเทอร์เน็ต แล้วกดลองใหม่</div>
    <div><button class="btn" id="retry">ลองใหม่</button></div></div>`}`;
    $('#out').onclick=()=>{me=null;try{localStorage.removeItem('jd-name')}catch(e){}render()};
    if($('#retry'))$('#retry').onclick=()=>location.reload();return}
  app.innerHTML=`<div class="brand"><span class="mark">JD</span><b>Work Handoff</b><span class="sp"></span><span class="muted" style="font-size:14px">${esc(me)}</span><button class="btn ghost" id="out">ออก</button></div>
  ${adding?`<form class="sheet" id="af"><b>เพิ่มงาน</b><input id="tt" placeholder="หัวข้องาน เช่น ตรวจ Stock รองเท้า Nike" required>
    <div><label class="btn sm">📷 แนบรูปหัวข้อ<input type="file" accept="image/*" multiple hidden data-pick="t"></label><div class="pics" id="pt" style="margin-top:6px">${draftPicsHTML('t')}</div></div>
    <div><div style="font-size:13px;font-weight:600;margin-bottom:4px">รายละเอียด (ติ๊กข้อที่ทำแล้ว)</div><div id="dl">${checklistHTML(draft,true)}</div>
    <div class="row" style="margin-top:8px"><input id="ni" placeholder="เพิ่มหัวข้อ เช่น ตรวจ Warehouse A"><button type="button" class="btn" id="nadd">เพิ่ม</button></div></div>
    <textarea id="td" placeholder="หมายเหตุ (ไม่บังคับ)" style="min-height:56px"></textarea>
    <div><label class="btn sm">📷 แนบรูปหมายเหตุ<input type="file" accept="image/*" multiple hidden data-pick="n"></label><div class="pics" id="pn" style="margin-top:6px">${draftPicsHTML('n')}</div></div>
    <div class="act"><button type="button" class="btn" id="cancel">ยกเลิก</button><button class="btn pri" id="save">บันทึกงาน</button></div></form>`
   :`<button class="btn acc big" id="add">+ เพิ่มงาน</button>`}
  ${tasks.length?`<div class="muted" style="font-size:13px">งานทั้งหมด ${tasks.length} · ยังไม่มีคนรับ ${open}</div><div class="list">${tasks.map(t=>{const n=items(t).length;return `<div class="card"><div class="body">
     <div class="t">${esc(t.title)}</div>${picsHTML(t.photos)}
     <div class="meta"><span>เพิ่มโดย <b>${esc(t.createdBy)}</b> · ${ago(t.createdAt)}</span>${t.claimedBy?`<span>รับงานโดย <b>${esc(t.claimedBy)}</b></span>`:''}${n?`<span>ทำแล้ว <b>${doneN(t)}/${n}</b></span>`:''}</div>
     ${n?`<div class="prog"><i style="width:${doneN(t)/n*100}%"></i></div>`:''}</div>
     <div class="act"><button class="btn sm" data-open="${esc(t.id)}">ดูรายละเอียด</button>${t.claimedBy?`<span class="pill" style="color:var(--ok);align-self:center">รับงานแล้ว</span>`:`<button class="btn sm pri" data-claim="${esc(t.id)}">รับงาน</button>`}</div></div>`}).join('')}</div>`
   :(adding?'':`<div class="empty">ยังไม่มีงาน<br>กด “+ เพิ่มงาน” เพื่อเริ่ม</div>`)}
  ${conn==='ok'?`<div class="note">● ข้อมูลบันทึกอัตโนมัติ ทุกคนที่มีลิงก์เห็นงานชุดเดียวกัน</div>`:''}
  ${detailHTML()}`;
  bind()}

function detailHTML(){const t=tasks.find(x=>x.id===openId);if(!t)return'';const n=items(t).length;
  return `<div class="modal-bg" id="mbg"><div class="modal" role="dialog" aria-modal="true">
   <div class="row"><b style="font-size:18px;flex:1;min-width:0;overflow-wrap:anywhere">${esc(t.title)}</b><button class="btn ghost" id="close">ปิด</button></div>
   ${picsHTML(t.photos)}
   <div class="meta" style="margin-top:0"><span>เพิ่มโดย <b>${esc(t.createdBy)}</b> · ${ago(t.createdAt)}</span><span>${t.claimedBy?`รับงานโดย <b>${esc(t.claimedBy)}</b>`:'ยังไม่มีคนรับงาน'}</span></div>
   ${n?`<div><div class="row"><b style="font-size:14px">รายละเอียด</b><span class="sp"></span><span class="muted" style="font-size:13px">ทำแล้ว ${doneN(t)}/${n}</span></div><div class="prog"><i style="width:${doneN(t)/n*100}%"></i></div><div id="cl">${checklistHTML(items(t),false)}</div></div>`:''}
   ${t.desc||t.notePhotos.length?`<div><b style="font-size:14px">หมายเหตุ</b><div style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(t.desc)}</div>${picsHTML(t.notePhotos)}</div>`:''}
   ${!n&&!t.desc&&!t.notePhotos.length?'<div class="muted">ไม่มีรายละเอียด</div>':''}
   <div class="row"><input id="mi" placeholder="เพิ่มหัวข้อใหม่"><button class="btn" id="madd">เพิ่ม</button></div>
   ${delId===t.id?`<div class="sheet" style="border-color:#c62828"><b>ลบงาน “${esc(t.title)}”?</b><div class="muted" style="font-size:13px">ลบแล้วกู้คืนไม่ได้ ทุกคนจะไม่เห็นงานนี้อีก</div><div class="act"><button class="btn" id="dno">ไม่ลบ</button><button class="btn danger" id="dyes">ลบงาน</button></div></div>`
    :`<div class="act"><button class="btn danger" id="del">ลบงาน</button>${t.claimedBy?'':`<button class="btn pri" data-claim="${esc(t.id)}">รับงาน</button>`}</div>`}
  </div></div>`}

function bind(){
  $('#out').onclick=()=>{me=null;try{localStorage.removeItem('jd-name')}catch(e){}render()};
  if(adding){const ni=$('#ni');
    const push=()=>{const v=ni.value.trim();if(!v)return;draft.push({text:v,done:false});$('#dl').innerHTML=checklistHTML(draft,true);ni.value='';ni.focus()};
    $('#nadd').onclick=push;ni.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();push()}};
    $('#dl').onclick=e=>{const rm=e.target.closest('[data-rm]');if(rm){e.preventDefault();draft.splice(+rm.dataset.rm,1);$('#dl').innerHTML=checklistHTML(draft,true)}};
    $('#dl').onchange=e=>{const i=e.target.dataset.i;if(i==null)return;draft[i].done=e.target.checked;$('#dl').innerHTML=checklistHTML(draft,true)};
    const showPics=k=>{$('#p'+k).innerHTML=draftPicsHTML(k)};
    document.querySelectorAll('[data-pick]').forEach(inp=>inp.onchange=()=>{const k=inp.dataset.pick;for(const f of inp.files)draftPics[k].push({file:f,url:URL.createObjectURL(f)});inp.value='';showPics(k)});
    $('#af').addEventListener('click',e=>{const b=e.target.closest('[data-rp]');if(!b)return;const[k,i]=b.dataset.rp.split(':');URL.revokeObjectURL(draftPics[k][i].url);draftPics[k].splice(+i,1);showPics(k)});
    $('#cancel').onclick=()=>{adding=false;draft=[];clearPics();render()};
    $('#af').onsubmit=async e=>{e.preventDefault();const title=$('#tt').value.trim();if(!title)return;const pending=ni.value.trim();if(pending)draft.push({text:pending,done:false});
      const t={title,items:draft,desc:$('#td').value.trim(),createdBy:me,createdAt:Date.now(),claimedBy:null};
      const save=$('#save');save.disabled=true;
      if(draftPics.t.length||draftPics.n.length){save.textContent='กำลังอัปโหลดรูป…';
        try{const a=await upload(draftPics.t.map(x=>x.file)),b=await upload(draftPics.n.map(x=>x.file));if(a.length)t.photos=a;if(b.length)t.notePhotos=b}
        catch(err){save.disabled=false;save.textContent='บันทึกงาน';alertMsg('อัปโหลดรูปไม่สำเร็จ: '+(err.message||err));return}}
      adding=false;draft=[];clearPics();render();
      await run(()=>addTask(t),'เพิ่มงานไม่สำเร็จ')};
    $('#tt').focus()}
  else $('#add').onclick=()=>{adding=true;draft=[];clearPics();render()};
  document.querySelectorAll('[data-claim]').forEach(b=>b.onclick=()=>{b.disabled=true;run(()=>patch(b.dataset.claim,{claimedBy:me,claimedAt:Date.now()}),'รับงานไม่สำเร็จ')});
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{openId=b.dataset.open;delId=null;render()});
  const t=tasks.find(x=>x.id===openId);if(!t)return;
  const close=()=>{openId=null;delId=null;render()};
  $('#close').onclick=close;$('#mbg').onclick=e=>{if(e.target.id==='mbg')close()};
  const cl=$('#cl');if(cl)cl.onchange=e=>{const i=+e.target.dataset.i;const list=items(t).map((x,j)=>j===i?{...x,done:e.target.checked}:x);run(()=>patch(t.id,{items:list}),'บันทึกไม่สำเร็จ')};
  const mi=$('#mi');const madd=()=>{const v=mi.value.trim();if(!v)return;run(()=>patch(t.id,{items:[...items(t),{text:v,done:false}]}),'เพิ่มหัวข้อไม่สำเร็จ')};
  $('#madd').onclick=madd;mi.onkeydown=e=>{if(e.key==='Enter')madd()};
  if($('#del'))$('#del').onclick=()=>{delId=t.id;render()};
  if($('#dno'))$('#dno').onclick=()=>{delId=null;render()};
  if($('#dyes'))$('#dyes').onclick=()=>{const id=t.id;openId=null;delId=null;render();run(()=>remove(id),'ลบไม่สำเร็จ')};
}
let draftPics={t:[],n:[]};function clearPics(){for(const k in draftPics)draftPics[k].forEach(x=>URL.revokeObjectURL(x.url));draftPics={t:[],n:[]}}
function alertMsg(m){const n=document.createElement('div');n.className='note';n.style.color='var(--wait)';n.textContent=m;$('#app').append(n);setTimeout(()=>n.remove(),4000)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&openId){openId=null;delId=null;render()}});
render();

async function load(){const{data,error}=await col.from('tasks').select('*').order('created_at',{ascending:false});
  if(error){if(conn!=='ok'){conn='off';render()}return}
  tasks=data.map(fromRow);if(openId&&!tasks.some(x=>x.id===openId))openId=null;
  const first=conn!=='ok';conn='ok';
  if(first||!adding&&!(document.activeElement&&document.activeElement.id==='mi'&&document.activeElement.value))render()}
(()=>{if(!window.supabase){conn='off';render();return}
  col=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  load();
  col.channel('tasks').on('postgres_changes',{event:'*',schema:'public',table:'tasks'},()=>load()).subscribe();
  setInterval(()=>{if(!document.hidden)load()},15000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
})();
</script>
